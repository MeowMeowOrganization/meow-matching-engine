[package]
name = "meow-matching-engine"
version = "0.1.0"
edition = "2024"

[dependencies]
sha2 = "0.11.0"
thiserror = "2.0"

[dev-dependencies]
criterion = { version = "0.8.2", features = ["html_reports"] }

[[bench]]
name = "foundation"
harness = false

[[bench]]
name = "book"
harness = false

[[bench]]
name = "engine"
harness = false

[[bench]]
name = "state_hash"
harness = false

[[bench]]
name = "latency"
harness = false

[lints.rust]
unsafe_code = "forbid"

[lints.clippy]
all = "warn"
pedantic = "warn"
